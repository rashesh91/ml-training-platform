# Single-node E2E overrides — JarvisLabs L4 server
# Images pre-loaded into k3s containerd via k3s ctr images import
global:
  imageRegistry: ""
  imagePullPolicy: Never

trainingApi:
  ingress:
    enabled: true
    host: training.aitest.lintel.in

rayCluster:
  gpu:
    enabled: false     # GPU reserved for voice-platform Ollama
  replicas:
    workers: 1
  resources:
    head:
      requests: { memory: "2Gi", cpu: "1" }
      limits:   { memory: "4Gi", cpu: "2" }
    worker:
      requests: { memory: "4Gi", cpu: "2" }
      limits:   { memory: "8Gi", cpu: "4" }
