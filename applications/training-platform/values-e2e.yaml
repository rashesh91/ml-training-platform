# Single-node E2E overrides — JarvisLabs L4 server
# Images pre-loaded into k3s containerd via k3s ctr images import
global:
  imageRegistry: ""
  imagePullPolicy: Never

trainingApi:
  ingress:
    enabled: true
    host: training.aitest.lintel.in

rayCluster:
  enabled: false  # Not needed for e2e; Argo Workflows handles training jobs
