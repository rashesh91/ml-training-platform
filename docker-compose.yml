version: "3.9"

# ML Training Platform — Local Development
# No Kubernetes needed. Uses: MLflow + MinIO + PostgreSQL + fine-tuner + evaluator
#
# Start:  docker compose up --build
# UI:     http://localhost:8004
# MLflow: http://localhost:5000
# MinIO:  http://localhost:9001  (admin/minioadmin)

x-minio-env: &minio-env
  MINIO_ENDPOINT: http://minio:9000
  MINIO_ACCESS_KEY: minioadmin
  MINIO_SECRET_KEY: minioadmin

x-mlflow-env: &mlflow-env
  MLFLOW_TRACKING_URI: http://mlflow:5000

services:
  # ── MinIO (S3-compatible object storage) ─────────────────────────────────────
  minio:
    image: quay.io/minio/minio:RELEASE.2024-05-01T01-11-10Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Create buckets on startup
  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/datasets;
      mc mb --ignore-existing local/checkpoints;
      mc mb --ignore-existing local/models;
      mc mb --ignore-existing local/mlflow;
      echo 'Buckets ready';
      "
    restart: "no"

  # ── PostgreSQL (MLflow backend store) ────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mlflow
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: mlflow-dev
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlflow -d mlflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── MLflow Tracking Server ───────────────────────────────────────────────────
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.13.0
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri postgresql://mlflow:mlflow-dev@postgres:5432/mlflow
      --default-artifact-root s3://mlflow/
      --serve-artifacts
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_DEFAULT_REGION: us-east-1
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ── Fine-tuner Service (CPU mode locally) ────────────────────────────────────
  fine-tuner:
    build:
      context: ./services/fine-tuner
      dockerfile: Dockerfile
    depends_on:
      mlflow:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      <<: [*minio-env, *mlflow-env]
      EVALUATOR_URL: http://evaluator:8005
    ports:
      - "8003:8003"
    volumes:
      - model-cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    # GPU: uncomment to use NVIDIA GPU for training (requires nvidia-container-toolkit)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # ── Evaluator Service ────────────────────────────────────────────────────────
  evaluator:
    build:
      context: ./services/evaluator
      dockerfile: Dockerfile
    depends_on:
      mlflow:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      <<: [*minio-env, *mlflow-env]
      ROUGE_THRESHOLD: "0.05"
    ports:
      - "8005:8005"
    volumes:
      - model-cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8005/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ── Training API + Dashboard UI ──────────────────────────────────────────────
  training-api:
    build:
      context: ./services/training-api
      dockerfile: Dockerfile
    depends_on:
      fine-tuner:
        condition: service_healthy
      evaluator:
        condition: service_healthy
      mlflow:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      <<: [*minio-env, *mlflow-env]
      USE_ARGO: "false"
      FINE_TUNER_URL: http://fine-tuner:8003
      # ── Inference GitOps integration (leave blank to skip in local dev) ──────
      GITHUB_TOKEN: ""
      INFERENCE_GITOPS_REPO: "rashesh91/ml-inference-gitops"
      INFERENCE_GITOPS_BRANCH: "main"
      INFERENCE_GITOPS_VALUES_PATH: "applications/voice-platform/values.yaml"
      ARGOCD_SERVER: ""
      ARGOCD_TOKEN: ""
      ARGOCD_APP_NAME: "voice-platform-prod"
      ARGOCD_INSECURE: "false"
    ports:
      - "8004:8004"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  minio-data:
  postgres-data:
  model-cache:    # Cache HuggingFace model weights between restarts
