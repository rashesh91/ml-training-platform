---
# Wave 0: Namespaces + RBAC
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ml-training-namespaces
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: ml-training
  source:
    repoURL: https://github.com/rashesh91/ml-training-platform.git
    targetRevision: HEAD
    path: infrastructure/namespaces
  destination:
    server: https://kubernetes.default.svc
    namespace: ml-training
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ml-training-rbac
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: ml-training
  source:
    repoURL: https://github.com/rashesh91/ml-training-platform.git
    targetRevision: HEAD
    path: infrastructure/rbac
  destination:
    server: https://kubernetes.default.svc
    namespace: ml-training
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
---
# Wave 1: KubeRay Operator
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kuberay-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: ml-training
  source:
    repoURL: https://kuberay.github.io/kuberay-helm-chart
    chart: kuberay-operator
    targetRevision: 1.1.1
    helm:
      valuesFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: ml-training
  syncPolicy:
    automated:
      prune: false  # Never auto-prune operators
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
# Wave 1: Argo Workflows
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-workflows
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: ml-training
  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argo-workflows
    targetRevision: 0.42.5
    helm:
      valueFiles: []
      values: |
        workflow:
          serviceAccount:
            create: true
            name: ml-training-sa
        controller:
          workflowNamespaces:
            - ml-training
        server:
          authModes:
            - server
  destination:
    server: https://kubernetes.default.svc
    namespace: ml-training
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
---
# Wave 2: MinIO + PostgreSQL
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: minio
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: ml-training
  source:
    repoURL: https://charts.min.io
    chart: minio
    targetRevision: 5.2.0
    helm:
      valuesObject:
        rootUser: minioadmin
        rootPassword: minioadmin
        persistence:
          enabled: true
          size: 50Gi
        buckets:
          - name: datasets
            policy: none
          - name: checkpoints
            policy: none
          - name: models
            policy: none
          - name: mlflow
            policy: none
  destination:
    server: https://kubernetes.default.svc
    namespace: ml-training
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgres
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: ml-training
  source:
    repoURL: https://github.com/rashesh91/ml-training-platform.git
    targetRevision: HEAD
    path: infrastructure/postgres
  destination:
    server: https://kubernetes.default.svc
    namespace: ml-training
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
---
# Wave 3: MLflow (depends on postgres + minio being ready)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mlflow
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: ml-training
  source:
    repoURL: https://github.com/rashesh91/ml-training-platform.git
    targetRevision: HEAD
    path: infrastructure/mlflow
  destination:
    server: https://kubernetes.default.svc
    namespace: ml-training
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
