---
# Wave 3: MLflow
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mlflow-e2e
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: ml-training
  source:
    repoURL: https://github.com/rashesh91/ml-training-platform.git
    targetRevision: HEAD
    path: infrastructure/mlflow
  destination:
    server: https://kubernetes.default.svc
    namespace: ml-training
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
