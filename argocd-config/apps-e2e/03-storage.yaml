---
# Wave 2: MinIO — reduced to 10Gi for single-node
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: minio-e2e
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: ml-training
  source:
    repoURL: https://charts.min.io
    chart: minio
    targetRevision: 5.2.0
    helm:
      valuesObject:
        rootUser: minioadmin
        rootPassword: minioadmin
        mode: standalone
        replicas: 1
        persistence:
          enabled: true
          size: 10Gi
        buckets:
          - name: datasets
            policy: none
          - name: checkpoints
            policy: none
          - name: models
            policy: none
          - name: mlflow
            policy: none
        resources:
          requests:
            memory: 512Mi
            cpu: 250m
          limits:
            memory: 1Gi
            cpu: 500m
  destination:
    server: https://kubernetes.default.svc
    namespace: ml-training
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
---
# Wave 2: PostgreSQL
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgres-e2e
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: ml-training
  source:
    repoURL: https://github.com/rashesh91/ml-training-platform.git
    targetRevision: HEAD
    path: infrastructure/postgres
  destination:
    server: https://kubernetes.default.svc
    namespace: ml-training
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
