apiVersion: v1
kind: ServiceAccount
metadata:
  name: ml-training-sa
  namespace: ml-training
  labels:
    app.kubernetes.io/part-of: ml-training-platform
---
# Allow ml-training-sa to manage RayJobs and Argo Workflows
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ml-training-role
  namespace: ml-training
rules:
  - apiGroups: ["ray.io"]
    resources: ["rayjobs", "rayclusters"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["argoproj.io"]
    resources: ["workflows", "workflowtemplates", "cronworkflows"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services", "configmaps", "secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ml-training-rolebinding
  namespace: ml-training
subjects:
  - kind: ServiceAccount
    name: ml-training-sa
    namespace: ml-training
roleRef:
  kind: Role
  name: ml-training-role
  apiGroup: rbac.authorization.k8s.io
---
# Secrets for local development (REPLACE with SealedSecrets in production)
apiVersion: v1
kind: Secret
metadata:
  name: minio-credentials
  namespace: ml-training
  annotations:
    # Replace this with: kubeseal --format yaml < secret.yaml > sealed-secret.yaml
    note: "DO NOT COMMIT — use SealedSecrets in production"
type: Opaque
stringData:
  endpoint: "http://minio.ml-training.svc.cluster.local:9000"
  access_key: "minioadmin"
  secret_key: "minioadmin"
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: ml-training
  annotations:
    note: "DO NOT COMMIT — use SealedSecrets in production"
type: Opaque
stringData:
  username: "mlflow"
  password: "mlflow-secret-change-me"
