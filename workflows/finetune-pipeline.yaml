apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: finetune-pipeline-ray
  namespace: ml-training
  labels:
    app: ml-training-platform
spec:
  entrypoint: finetune-pipeline
  serviceAccountName: ml-training-sa
  arguments:
    parameters:
      - name: config
        value: "{}"

  templates:
    # ─── Main DAG ───────────────────────────────────────────────────────────────
    - name: finetune-pipeline
      dag:
        tasks:
          - name: preprocess
            template: preprocess-dataset
            arguments:
              parameters:
                - name: config
                  value: "{{workflow.parameters.config}}"

          - name: train
            template: launch-ray-job
            dependencies: [preprocess]
            arguments:
              parameters:
                - name: config
                  value: "{{workflow.parameters.config}}"
                - name: dataset_valid
                  value: "{{tasks.preprocess.outputs.parameters.dataset_valid}}"

          - name: evaluate
            template: run-evaluation
            dependencies: [train]
            arguments:
              parameters:
                - name: config
                  value: "{{workflow.parameters.config}}"
                - name: mlflow_run_id
                  value: "{{tasks.train.outputs.parameters.mlflow_run_id}}"

          - name: promote
            template: promote-model
            dependencies: [evaluate]
            when: "{{tasks.evaluate.outputs.parameters.eval_passed}} == true"
            arguments:
              parameters:
                - name: config
                  value: "{{workflow.parameters.config}}"
                - name: mlflow_run_id
                  value: "{{tasks.train.outputs.parameters.mlflow_run_id}}"

          - name: deploy-to-inference
            template: trigger-inference-deploy
            dependencies: [promote]
            when: "{{tasks.evaluate.outputs.parameters.eval_passed}} == true"
            arguments:
              parameters:
                - name: config
                  value: "{{workflow.parameters.config}}"
                - name: mlflow_run_id
                  value: "{{tasks.train.outputs.parameters.mlflow_run_id}}"

          - name: notify-complete
            template: update-job-status
            dependencies: [deploy-to-inference]
            arguments:
              parameters:
                - name: config
                  value: "{{workflow.parameters.config}}"
                - name: status
                  value: "succeeded"

    # ─── Step 1: Preprocess ─────────────────────────────────────────────────────
    - name: preprocess-dataset
      inputs:
        parameters:
          - name: config
      outputs:
        parameters:
          - name: dataset_valid
            valueFrom:
              path: /tmp/dataset_valid.txt
      script:
        image: python:3.11-slim
        command: [python]
        source: |
          import json, os, sys, boto3
          from botocore.client import Config

          config = json.loads('''{{inputs.parameters.config}}''')
          job_id = config['job_id']
          bucket = config.get('dataset_bucket', 'datasets')
          key = config.get('dataset_key', f'{job_id}/dataset.jsonl')

          s3 = boto3.client(
              's3',
              endpoint_url=os.environ['MINIO_ENDPOINT'],
              aws_access_key_id=os.environ['MINIO_ACCESS_KEY'],
              aws_secret_access_key=os.environ['MINIO_SECRET_KEY'],
              config=Config(signature_version='s3v4'),
              region_name='us-east-1',
          )
          obj = s3.get_object(Bucket=bucket, Key=key)
          lines = obj['Body'].read().decode('utf-8').strip().split('\n')
          records = [json.loads(l) for l in lines if l.strip()]

          # Validate format
          valid = all(('prompt' in r and 'response' in r) or 'text' in r for r in records)
          print(f"Dataset: {len(records)} records, valid={valid}")

          with open('/tmp/dataset_valid.txt', 'w') as f:
              f.write('true' if valid else 'false')

          if not valid:
              sys.exit(1)
        env:
          - name: MINIO_ENDPOINT
            valueFrom:
              secretKeyRef:
                name: minio-credentials
                key: endpoint
          - name: MINIO_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: minio-credentials
                key: access_key
          - name: MINIO_SECRET_KEY
            valueFrom:
              secretKeyRef:
                name: minio-credentials
                key: secret_key
        resources:
          requests:
            memory: 256Mi
            cpu: 100m

    # ─── Step 2: Ray Training Job ────────────────────────────────────────────────
    - name: launch-ray-job
      inputs:
        parameters:
          - name: config
          - name: dataset_valid
      outputs:
        parameters:
          - name: mlflow_run_id
            valueFrom:
              path: /tmp/mlflow_run_id.txt
      resource:
        action: create
        successCondition: status.jobDeploymentStatus == Complete
        failureCondition: status.jobDeploymentStatus == Failed
        manifest: |
          apiVersion: ray.io/v1
          kind: RayJob
          metadata:
            generateName: finetune-rayjob-
            namespace: ml-training
          spec:
            entrypoint: "python /app/train.py"
            runtimeEnvYAML: |
              env_vars:
                JOB_CONFIG_PATH: /configs/job.json
              working_dir: /app
            shutdownAfterJobFinishes: true
            ttlSecondsAfterFinished: 3600
            rayClusterSpec:
              headGroupSpec:
                rayStartParams:
                  dashboard-host: "0.0.0.0"
                template:
                  spec:
                    containers:
                      - name: ray-head
                        image: {{ index (fromJson .inputs.parameters.config) "registry" }}/fine-tuner:latest
                        resources:
                          requests:
                            memory: 4Gi
                            cpu: 2
                        env:
                          - name: MINIO_ENDPOINT
                            valueFrom:
                              secretKeyRef:
                                name: minio-credentials
                                key: endpoint
                          - name: MINIO_ACCESS_KEY
                            valueFrom:
                              secretKeyRef:
                                name: minio-credentials
                                key: access_key
                          - name: MINIO_SECRET_KEY
                            valueFrom:
                              secretKeyRef:
                                name: minio-credentials
                                key: secret_key
                          - name: MLFLOW_TRACKING_URI
                            value: "http://mlflow.ml-training.svc.cluster.local:5000"
              workerGroupSpecs:
                - replicas: 1
                  groupName: gpu-workers
                  rayStartParams: {}
                  template:
                    spec:
                      tolerations:
                        - key: nvidia.com/gpu
                          operator: Exists
                          effect: NoSchedule
                      containers:
                        - name: ray-worker
                          image: {{ index (fromJson .inputs.parameters.config) "registry" }}/fine-tuner:latest
                          resources:
                            requests:
                              memory: 8Gi
                              cpu: 4
                              nvidia.com/gpu: 1
                            limits:
                              memory: 16Gi
                              cpu: 8
                              nvidia.com/gpu: 1
                          volumeMounts:
                            - name: job-config
                              mountPath: /configs
                      volumes:
                        - name: job-config
                          configMap:
                            name: finetune-config-{{ index (fromJson .inputs.parameters.config) "job_id" }}

    # ─── Step 3: Evaluate ────────────────────────────────────────────────────────
    - name: run-evaluation
      inputs:
        parameters:
          - name: config
          - name: mlflow_run_id
      outputs:
        parameters:
          - name: eval_passed
            valueFrom:
              path: /tmp/eval_passed.txt
          - name: rouge_l
            valueFrom:
              path: /tmp/rouge_l.txt
      container:
        image: "{{index (fromJson .inputs.parameters.config) \"registry\"}}/evaluator:latest"
        command: [python, evaluate.py]
        env:
          - name: JOB_CONFIG_PATH
            value: /configs/eval.json
          - name: MINIO_ENDPOINT
            valueFrom:
              secretKeyRef:
                name: minio-credentials
                key: endpoint
          - name: MINIO_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: minio-credentials
                key: access_key
          - name: MINIO_SECRET_KEY
            valueFrom:
              secretKeyRef:
                name: minio-credentials
                key: secret_key
          - name: MLFLOW_TRACKING_URI
            value: "http://mlflow.ml-training.svc.cluster.local:5000"
          - name: ROUGE_THRESHOLD
            value: "0.05"
        volumeMounts:
          - name: eval-config
            mountPath: /configs
        resources:
          requests:
            memory: 4Gi
            cpu: 2
      volumes:
        - name: eval-config
          configMap:
            name: evalconfig-"{{workflow.parameters.config | fromJson | dig \"job_id\" \"\"}}"

    # ─── Step 4: Promote to Production ──────────────────────────────────────────
    - name: promote-model
      inputs:
        parameters:
          - name: config
          - name: mlflow_run_id
      script:
        image: python:3.11-slim
        command: [sh, -c]
        source: |
          pip install -q mlflow && python - <<'EOF'
          import json, os, mlflow

          config = json.loads('''{{inputs.parameters.config}}''')
          mlflow.set_tracking_uri(os.environ.get('MLFLOW_TRACKING_URI', 'http://mlflow:5000'))
          client = mlflow.tracking.MlflowClient()
          model_name = config['model_name']
          run_id = '{{inputs.parameters.mlflow_run_id}}'

          for mv in client.search_model_versions(f"name='{model_name}'"):
              if mv.run_id == run_id:
                  client.transition_model_version_stage(
                      name=model_name, version=mv.version, stage='Production'
                  )
                  print(f"Promoted {model_name} v{mv.version} → Production")
                  break
          EOF
        env:
          - name: MLFLOW_TRACKING_URI
            value: "http://mlflow.ml-training.svc.cluster.local:5000"
        resources:
          requests:
            memory: 256Mi
            cpu: 100m

    # ─── Step 5: Deploy to ml-inference-gitops ──────────────────────────────────
    - name: trigger-inference-deploy
      inputs:
        parameters:
          - name: config
          - name: mlflow_run_id
      script:
        image: python:3.11-slim
        command: [sh, -c]
        source: |
          pip install -q httpx && python - <<'EOF'
          import json, httpx, os
          config = json.loads('''{{inputs.parameters.config}}''')
          model_name = config['model_name']
          run_id = '{{inputs.parameters.mlflow_run_id}}'
          api_url = os.environ.get('TRAINING_API_URL', 'http://training-api.ml-training.svc.cluster.local:8004')
          try:
              r = httpx.post(
                  f'{api_url}/api/internal/deploy-to-inference',
                  json={'model_name': model_name, 'version': 'latest', 'run_id': run_id},
                  timeout=60,
              )
              print(f"Deploy response {r.status_code}: {r.text}")
          except Exception as e:
              print(f"Warning: inference deploy notification failed: {e}")
          EOF
        env:
          - name: TRAINING_API_URL
            value: "http://training-api.ml-training.svc.cluster.local:8004"
        resources:
          requests:
            memory: 128Mi
            cpu: 50m

    # ─── Step 6: Notify training-api ────────────────────────────────────────────
    - name: update-job-status
      inputs:
        parameters:
          - name: config
          - name: status
      script:
        image: python:3.11-slim
        command: [sh, -c]
        source: |
          pip install -q httpx && python - <<'EOF'
          import json, httpx, os
          config = json.loads('''{{inputs.parameters.config}}''')
          job_id = config['job_id']
          status = '{{inputs.parameters.status}}'
          api_url = os.environ.get('TRAINING_API_URL', 'http://training-api.ml-training.svc.cluster.local:8004')
          try:
              r = httpx.patch(f'{api_url}/api/jobs/{job_id}/status', json={'status': status}, timeout=10)
              print(f"Updated job {job_id} status to {status}: {r.status_code}")
          except Exception as e:
              print(f"Warning: could not notify training-api: {e}")
          EOF
        env:
          - name: TRAINING_API_URL
            value: "http://training-api.ml-training.svc.cluster.local:8004"
        resources:
          requests:
            memory: 128Mi
            cpu: 50m
