apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: finetune-pipeline
  namespace: ml-training
  labels:
    app: ml-training-platform
spec:
  entrypoint: finetune-pipeline
  serviceAccountName: ml-training-sa
  arguments:
    parameters:
      - name: config
        value: "{}"

  templates:
    # ─── Main DAG ───────────────────────────────────────────────────────────────
    - name: finetune-pipeline
      dag:
        tasks:
          - name: preprocess
            template: preprocess-dataset
            arguments:
              parameters:
                - name: config
                  value: "{{workflow.parameters.config}}"

          - name: train
            template: run-fine-tuner
            dependencies: [preprocess]
            arguments:
              parameters:
                - name: config
                  value: "{{workflow.parameters.config}}"

          - name: evaluate
            template: run-evaluation
            dependencies: [train]
            arguments:
              parameters:
                - name: config
                  value: "{{workflow.parameters.config}}"
                - name: mlflow_run_id
                  value: "{{tasks.train.outputs.parameters.mlflow_run_id}}"

          - name: promote
            template: promote-model
            dependencies: [evaluate]
            when: "{{tasks.evaluate.outputs.parameters.eval_passed}} == true"
            arguments:
              parameters:
                - name: config
                  value: "{{workflow.parameters.config}}"
                - name: mlflow_run_id
                  value: "{{tasks.train.outputs.parameters.mlflow_run_id}}"

    # ─── Step 1: Preprocess ─────────────────────────────────────────────────────
    - name: preprocess-dataset
      inputs:
        parameters:
          - name: config
      outputs:
        parameters:
          - name: dataset_valid
            valueFrom:
              path: /tmp/dataset_valid.txt
      script:
        image: python:3.11-slim
        imagePullPolicy: IfNotPresent
        command: [sh, -c]
        source: |
          pip install boto3 -q && python3 - <<'EOF'
          import json, os, sys, boto3
          from botocore.client import Config

          config = json.loads(os.environ['JOB_CONFIG'])
          job_id = config['job_id']
          bucket = config.get('dataset_bucket', 'datasets')
          key = config.get('dataset_key', f'{job_id}/dataset.jsonl')

          s3 = boto3.client('s3',
              endpoint_url=os.environ['MINIO_ENDPOINT'],
              aws_access_key_id=os.environ['MINIO_ACCESS_KEY'],
              aws_secret_access_key=os.environ['MINIO_SECRET_KEY'],
              config=Config(signature_version='s3v4'),
              region_name='us-east-1')

          obj = s3.get_object(Bucket=bucket, Key=key)
          content = obj['Body'].read().decode('utf-8').strip()
          # Support both JSON array and JSONL
          if content.startswith('['):
              records = json.loads(content)
          else:
              records = [json.loads(l) for l in content.split('\n') if l.strip()]

          valid = all(
              ('prompt' in r and 'response' in r) or
              ('instruction' in r and 'response' in r) or
              'text' in r
              for r in records
          )
          print(f"Dataset: {len(records)} records, valid={valid}")
          with open('/tmp/dataset_valid.txt', 'w') as f:
              f.write('true' if valid else 'false')
          if not valid:
              sys.exit(1)
          EOF
        env:
          - name: JOB_CONFIG
            value: "{{inputs.parameters.config}}"
          - name: MINIO_ENDPOINT
            valueFrom:
              secretKeyRef:
                name: minio-credentials
                key: endpoint
          - name: MINIO_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: minio-credentials
                key: access_key
          - name: MINIO_SECRET_KEY
            valueFrom:
              secretKeyRef:
                name: minio-credentials
                key: secret_key
        resources:
          requests:
            memory: 256Mi
            cpu: 100m

    # ─── Step 2: Fine-tuner (GPU via runtimeClassName: nvidia) ─────────────────
    - name: run-fine-tuner
      podSpecPatch: '{"runtimeClassName": "nvidia"}'
      inputs:
        parameters:
          - name: config
      outputs:
        parameters:
          - name: mlflow_run_id
            valueFrom:
              path: /tmp/mlflow_run_id.txt
      container:
        image: docker.io/library/fine-tuner:latest
        imagePullPolicy: Never
        command: [sh, -c]
        args:
          - |
            mkdir -p /configs && \
            python3 -c "import os,json; json.dump(json.loads(os.environ['JOB_CONFIG']), open('/configs/job.json','w'))" && \
            sed -i 's/eval_strategy=/evaluation_strategy=/g' /app/train.py && \
            python3 -c "
            import json, sys
            sys.path.insert(0, '/app')
            from train import train
            config = json.load(open('/configs/job.json'))
            result = train(config)
            with open('/tmp/mlflow_run_id.txt', 'w') as f:
                f.write(result['mlflow_run_id'])
            print('mlflow_run_id:', result['mlflow_run_id'])
            "
        env:
          - name: JOB_CONFIG
            value: "{{inputs.parameters.config}}"
          - name: MINIO_ENDPOINT
            valueFrom:
              secretKeyRef:
                name: minio-credentials
                key: endpoint
          - name: MINIO_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: minio-credentials
                key: access_key
          - name: MINIO_SECRET_KEY
            valueFrom:
              secretKeyRef:
                name: minio-credentials
                key: secret_key
          - name: MLFLOW_TRACKING_URI
            value: "http://mlflow.ml-training.svc.cluster.local:5000"
          - name: MLFLOW_S3_ENDPOINT_URL
            valueFrom:
              secretKeyRef:
                name: minio-credentials
                key: endpoint
          - name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: minio-credentials
                key: access_key
          - name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: minio-credentials
                key: secret_key
        resources:
          requests:
            memory: 8Gi
            cpu: "2"
            nvidia.com/gpu: "1"
          limits:
            memory: 20Gi
            cpu: "4"
            nvidia.com/gpu: "1"

    # ─── Step 3: Evaluate ────────────────────────────────────────────────────────
    - name: run-evaluation
      podSpecPatch: '{"runtimeClassName": "nvidia"}'
      inputs:
        parameters:
          - name: config
          - name: mlflow_run_id
      outputs:
        parameters:
          - name: eval_passed
            valueFrom:
              path: /tmp/eval_passed.txt
          - name: rouge_l
            valueFrom:
              path: /tmp/rouge_l.txt
      container:
        image: docker.io/library/evaluator:latest
        imagePullPolicy: Never
        command: [sh, -c]
        args:
          - |
            mkdir -p /configs && \
            python3 -c "import os,json; json.dump(json.loads(os.environ['JOB_CONFIG']), open('/configs/job.json','w'))" && \
            cd /tmp && python3 -c "
            import json, sys, os, importlib.util
            import numpy as np
            _orig = json.JSONEncoder.default
            def _np_default(self, obj):
                if isinstance(obj, np.bool_): return bool(obj)
                if isinstance(obj, np.integer): return int(obj)
                if isinstance(obj, (np.floating, np.float32, np.float64)): return float(obj)
                if isinstance(obj, np.ndarray): return obj.tolist()
                return _orig(self, obj)
            json.JSONEncoder.default = _np_default
            sys.path = [p for p in sys.path if p not in ('', '/app')]
            spec = importlib.util.spec_from_file_location('evaluator_impl', '/app/evaluate.py')
            mod = importlib.util.module_from_spec(spec)
            sys.modules['evaluator_impl'] = mod
            spec.loader.exec_module(mod)
            evaluate_fn = mod.evaluate
            config = json.load(open('/configs/job.json'))
            config['mlflow_run_id'] = os.environ.get('MLFLOW_RUN_ID', '')
            config.setdefault('checkpoint_prefix', config['job_id'] + '/checkpoint')
            result = evaluate_fn(config)
            with open('/tmp/eval_passed.txt', 'w') as f:
                f.write('true' if bool(result.get('passed', False)) else 'false')
            with open('/tmp/rouge_l.txt', 'w') as f:
                f.write(str(float(result.get('rouge_l', 0))))
            print('eval_passed:', result.get('passed'), 'rouge_l:', result.get('rouge_l'))
            "
        env:
          - name: JOB_CONFIG
            value: "{{inputs.parameters.config}}"
          - name: MLFLOW_RUN_ID
            value: "{{inputs.parameters.mlflow_run_id}}"
          - name: MINIO_ENDPOINT
            valueFrom:
              secretKeyRef:
                name: minio-credentials
                key: endpoint
          - name: MINIO_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: minio-credentials
                key: access_key
          - name: MINIO_SECRET_KEY
            valueFrom:
              secretKeyRef:
                name: minio-credentials
                key: secret_key
          - name: MLFLOW_TRACKING_URI
            value: "http://mlflow.ml-training.svc.cluster.local:5000"
          - name: MLFLOW_S3_ENDPOINT_URL
            valueFrom:
              secretKeyRef:
                name: minio-credentials
                key: endpoint
          - name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: minio-credentials
                key: access_key
          - name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: minio-credentials
                key: secret_key
          - name: ROUGE_THRESHOLD
            value: "0.05"
        resources:
          requests:
            memory: 8Gi
            cpu: "2"
            nvidia.com/gpu: "1"
          limits:
            memory: 20Gi
            cpu: "4"
            nvidia.com/gpu: "1"

    # ─── Step 4: Promote ────────────────────────────────────────────────────────
    - name: promote-model
      inputs:
        parameters:
          - name: config
          - name: mlflow_run_id
      script:
        image: python:3.11-slim
        imagePullPolicy: IfNotPresent
        command: [sh, -c]
        source: |
          pip install mlflow psycopg2-binary -q && python3 - <<'EOF'
          import json, os, mlflow
          config = json.loads(os.environ['JOB_CONFIG'])
          mlflow.set_tracking_uri(os.environ.get('MLFLOW_TRACKING_URI', 'http://mlflow:5000'))
          client = mlflow.tracking.MlflowClient()
          model_name = config['model_name']
          run_id = os.environ['MLFLOW_RUN_ID']
          for mv in client.search_model_versions(f"name='{model_name}'"):
              if mv.run_id == run_id:
                  client.transition_model_version_stage(
                      name=model_name, version=mv.version, stage='Production')
                  print(f"Promoted {model_name} v{mv.version} -> Production")
                  break
          EOF
        env:
          - name: JOB_CONFIG
            value: "{{inputs.parameters.config}}"
          - name: MLFLOW_RUN_ID
            value: "{{inputs.parameters.mlflow_run_id}}"
          - name: MLFLOW_TRACKING_URI
            value: "http://mlflow.ml-training.svc.cluster.local:5000"
        resources:
          requests:
            memory: 256Mi
            cpu: 100m
